name: Validate and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Knowledge maintenance DOM and API smoke test
        run: |
          npm install --prefix "$RUNNER_TEMP/ontology-ui" --ignore-scripts --no-audit --no-fund jsdom@30.1.1
          NODE_PATH="$RUNNER_TEMP/ontology-ui/node_modules" node scripts/check-maintenance-ui.cjs
      - run: python scripts/build.py
