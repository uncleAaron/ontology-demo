services:
  ontology:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ontology-data:/app/data
    environment:
      ONTOLOGY_DB: /app/data/demo.sqlite3
      ONTOLOGY_MODEL_URL: ${ONTOLOGY_MODEL_URL:-}
      ONTOLOGY_MODEL_NAME: ${ONTOLOGY_MODEL_NAME:-}
      ONTOLOGY_MODEL_KEY: ${ONTOLOGY_MODEL_KEY:-}
      ONTOLOGY_MODEL_MAX_OUTPUT_TOKENS: ${ONTOLOGY_MODEL_MAX_OUTPUT_TOKENS:-4096}
    restart: unless-stopped
volumes:
  ontology-data:
